<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Analyse du projet · shadcn</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#171717}a:hover{color:#0A0A0A}
@keyframes sc-spin{to{transform:rotate(360deg)}}
.sc-spin{animation:sc-spin 0.9s linear infinite}
</style>
</helmet>
<div style="min-height: 860px; background: #FAFAFA; font-family: Geist, system-ui, sans-serif; color: #0A0A0A; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 24px; box-sizing: border-box; border-bottom: 1px solid #E5E5E5; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 8px">
<div style="width: 28px; height: 28px; border-radius: 8px; background: #171717; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h6"></path><path d="m16 16 2 2 4-4"></path></svg>
</div>
<span style="font-weight: 600; font-size: 15px">Ticket Studio</span>
</div>
<span aria-hidden="true" style="width: 1px; height: 16px; background: #E5E5E5"></span>
<nav aria-label="Fil d'Ariane">
<ol style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 6px; color: #737373">
<li><a href="01-saisie.dc.html" style="color: #737373; text-decoration: none">Saisie</a></li>
<li aria-hidden="true" style="display: flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></li>
<li aria-current="page" style="color: #0A0A0A">Analyse</li>
</ol>
</nav>
</div>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid #E5E5E5; border-radius: 6px; font-size: 12px; font-weight: 500; background: #FFFFFF">
<span style="width: 6px; height: 6px; border-radius: 50%; background: #16A34A"></span>
<span style="font-family: 'Geist Mono', monospace">shop-api</span>
<span style="color: #737373">main</span>
</span>
</header>

<main style="flex: 1; display: flex; justify-content: center; padding: 72px 24px; box-sizing: border-box">
<section style="width: 100%; max-width: 620px; align-self: flex-start; display: flex; flex-direction: column; gap: 24px; padding: 24px; background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05)">
<div style="display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 14px; color: #737373">Analyse de ton ticket</p>
<h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3">Permettre aux clients d'archiver leurs commandes terminées</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #737373">{{progressLabel}}</span><span style="font-weight: 500">{{pct}} %</span></div>
<div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}" style="height: 8px; border-radius: 999px; background: #E5E5E5; overflow: hidden"><div style="height: 100%; width: {{pct}}%; background: #171717; transition: width 0.5s ease"></div></div>
</div>

<ol aria-live="polite" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
<sc-for list="{{steps}}" as="step" hint-placeholder-count="5">
<li style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid #F0F0F0">
<span style="flex: none; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; margin-top: 1px">
<sc-if value="{{step.isDone}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
<sc-if value="{{step.isActive}}" hint-placeholder-val="{{ false }}"><svg class="sc-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></sc-if>
<sc-if value="{{step.isPending}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4D4D4" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg></sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-weight: 500; color: {{step.labelColor}}">{{step.label}}</span>
<sc-if value="{{step.isDone}}" hint-placeholder-val="{{ true }}"><span style="font-size: 14px; color: #737373">{{step.detail}}</span></sc-if>
</span>
</li>
</sc-for>
</ol>

<sc-if value="{{finished}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border: 1px solid #E5E5E5; border-radius: 10px">
<span style="display: flex; align-items: center; gap: 10px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
<span style="font-weight: 500">Analyse terminée</span>
<span style="color: #737373">· 3 sections à compléter</span>
</span>
<a href="03-diagnostic.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 8px; background: #171717; color: #FAFAFA; text-decoration: none; font-weight: 500">
Voir le diagnostic
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
</a>
</div>
</sc-if>
<sc-if value="{{running}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; justify-content: flex-end">
<a href="03-diagnostic.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 12px; border-radius: 8px; color: #0A0A0A; text-decoration: none; font-weight: 500">Passer</a>
</div>
</sc-if>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { done: 0 };
}
componentDidMount() {
this.timer = setInterval(() => {
if (this.state.done >= 5) { clearInterval(this.timer); return; }
this.setState({ done: this.state.done + 1 });
}, 900);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const raw = [
{ label: 'Lecture de la documentation du projet', detail: 'Boutique en ligne · site web, application mobile et back-office' },
{ label: 'Compréhension des données', detail: 'Commandes, clients, paiements, livraisons, remboursements' },
{ label: 'Historique des évolutions', detail: 'Les remboursements ont été ajoutés récemment' },
{ label: 'Recherche d’écrans et de comportements similaires', detail: 'Écran similaire trouvé : « Mes paniers sauvegardés »' },
{ label: 'Vérification des sections du ticket', detail: 'Titre rempli · 3 sections à compléter' }
];
const done = this.state.done;
const steps = raw.map((s, i) => ({
label: s.label, detail: s.detail,
isDone: i < done, isActive: i === done, isPending: i > done,
labelColor: i > done ? '#A3A3A3' : '#0A0A0A'
}));
return {
steps: steps,
pct: Math.round((done / raw.length) * 100),
progressLabel: done >= raw.length ? 'Terminé' : 'Étape ' + (done + 1) + ' sur ' + raw.length,
finished: done >= raw.length,
running: done < raw.length
};
}
}
</script>
</body>
</html>
